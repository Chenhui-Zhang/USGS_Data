name: Build PaperSprout macOS
on:
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build:mac
      - uses: actions/upload-artifact@v4
        with:
          name: PaperSprout-macOS
          path: dist/*.zip
          if-no-files-found: error
